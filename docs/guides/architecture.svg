<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">Thruk request flow</title>
  <desc id="desc">Browser and API clients connect through a web server to Thruk. Thruk connects to local Livestatus, optional LMD, or a remote Thruk backend. LMD can connect to both Livestatus and remote Thruk HTTP backends.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker>
  </defs>
  <g fill="#f1f5f9" stroke="#475569" stroke-width="2">
    <rect x="10" y="100" width="150" height="65" rx="8"/>
    <rect x="205" y="100" width="150" height="65" rx="8"/>
    <rect x="400" y="100" width="110" height="65" rx="8"/>
    <rect x="565" y="15" width="185" height="65" rx="8"/>
    <rect x="565" y="100" width="185" height="65" rx="8"/>
    <rect x="565" y="185" width="185" height="65" rx="8"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M160 132H205"/><path d="M355 132H400"/>
    <path d="M510 132H535V47H565"/><path d="M510 132H565"/><path d="M535 132V217H565"/>
    <path d="M657 100V80"/>
    <path d="M657 165V185"/>
  </g>
  <g fill="#0f172a" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="85" y="127">Browser or</text><text x="85" y="148">API client</text>
    <text x="280" y="138">Web server</text><text x="455" y="138">Thruk</text>
    <text x="657" y="42">Monitoring core</text><text x="657" y="63">Livestatus</text>
    <text x="657" y="127">LMD (optional)</text><text x="657" y="148">Livestatus proxy</text>
    <text x="657" y="212">Remote Thruk</text><text x="657" y="233">HTTP backend</text>
  </g>
</svg>
