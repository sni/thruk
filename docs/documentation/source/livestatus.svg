<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 555" role="img" aria-label="Livestatus architecture: the user's browser talks to a web server. The web server runs Apache and mod_fcgid. Apache starts a Fast CGI application, which runs Perl and Thruk. The Fast CGI application reads live data from the Naemon / Nagios Livestatus NEB module." style="width:100%;max-width:740px;height:auto" fill="currentColor" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="lv_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="currentColor"/></marker>
  </defs>

  <!-- title -->
  <text x="10" y="24" font-size="14" font-weight="bold">Livestatus</text>
  <line x1="10" y1="34" x2="730" y2="34" stroke="currentColor" stroke-width="1"/>

  <!-- User stick figure -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="80" cy="90" r="10" fill="var(--vp-c-bg, #fff)"/>
    <path d="M80 100 V130 M58 107 H102 M80 130 L68 168 M80 130 L92 168"/>
  </g>
  <text x="80" y="192" font-size="14" text-anchor="middle">User</text>

  <!-- Browser -->
  <rect x="150" y="70" width="190" height="130" fill="var(--vp-c-bg-soft, #e2e8f0)" stroke="currentColor" stroke-width="1.5"/>
  <text x="162" y="92" font-size="14">Browser</text>
  <rect x="205" y="105" width="90" height="50" fill="var(--vp-c-bg, #fff)" stroke="currentColor" stroke-width="1.5"/>
  <text x="250" y="135" font-size="14" text-anchor="middle">HTML / JS</text>

  <!-- Web Server -->
  <rect x="430" y="40" width="290" height="200" fill="var(--vp-c-bg-soft, #e2e8f0)" stroke="currentColor" stroke-width="1.5"/>
  <text x="442" y="62" font-size="14">Web Server</text>
  <rect x="470" y="75" width="230" height="145" fill="var(--vp-c-bg, #fff)" stroke="currentColor" stroke-width="1.5"/>
  <text x="490" y="100" font-size="14">Apache</text>
  <rect x="610" y="145" width="80" height="44" fill="var(--vp-c-bg, #fff)" stroke="currentColor" stroke-width="1.5"/>
  <text x="650" y="172" font-size="14" text-anchor="middle">mod_fcgid</text>

  <!-- Fast CGI Application -->
  <rect x="430" y="330" width="290" height="200" fill="var(--vp-c-bg-soft, #e2e8f0)" stroke="currentColor" stroke-width="1.5"/>
  <text x="442" y="352" font-size="14">Fast CGI Application</text>
  <rect x="470" y="365" width="230" height="145" fill="var(--vp-c-bg, #fff)" stroke="currentColor" stroke-width="1.5"/>
  <text x="490" y="390" font-size="14">Perl</text>
  <rect x="620" y="442" width="70" height="40" fill="var(--vp-c-bg, #fff)" stroke="currentColor" stroke-width="1.5"/>
  <text x="655" y="467" font-size="14" text-anchor="middle">Thruk</text>

  <!-- Naemon / Nagios -->
  <rect x="40" y="330" width="290" height="200" fill="var(--vp-c-bg-soft, #e2e8f0)" stroke="currentColor" stroke-width="1.5"/>
  <text x="52" y="352" font-size="14">Naemon / Nagios</text>
  <rect x="100" y="395" width="180" height="90" fill="var(--vp-c-bg, #fff)" stroke="currentColor" stroke-width="1.5"/>
  <text x="190" y="432" font-size="14" text-anchor="middle">Livestatus</text>
  <text x="190" y="450" font-size="14" text-anchor="middle">NEB Module</text>

  <!-- connections; bidirectional links use two paths so each end gets an arrowhead -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M108 130 H148" marker-end="url(#lv_arrow)"/>
    <path d="M428 130 H342" marker-end="url(#lv_arrow)"/>
    <path d="M575 240 V328" marker-end="url(#lv_arrow)"/>
    <path d="M575 328 V242" marker-end="url(#lv_arrow)"/>
    <path d="M428 440 H332" marker-end="url(#lv_arrow)"/>
    <path d="M332 440 H428" marker-end="url(#lv_arrow)"/>
  </g>
  <text x="385" y="120" font-size="14" font-style="italic" text-anchor="middle">HTTP(S)</text>
  <text x="585" y="284" font-size="14" dominant-baseline="middle">Socket</text>
  <text x="380" y="432" font-size="14" font-style="italic" text-anchor="middle">Livestatus</text>
</svg>
