  <text x="35" y="555">Naemon / Nagios n…</text>
  <g text-anchor="middle">
    <text x="565" y="110">Fast CGI Module</text>
    <text x="565" y="315">Thruk</text>
    <text x="135" y="291">Livestatus</text>
