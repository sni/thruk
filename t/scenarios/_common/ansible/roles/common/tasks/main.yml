- name: "switch centos 7 to vault.centos.org"
  shell: |
    sed -i -e 's%mirror.centos.org%vault.centos.org%g' /etc/yum.repos.d/CentOS-Base.repo
    sed -i -e 's%^mirrorlist=%#mirrorlist=%g'          /etc/yum.repos.d/CentOS-Base.repo
    sed -i -e 's%^#baseurl=%baseurl=%g'                /etc/yum.repos.d/CentOS-Base.repo
  when: ansible_distribution_major_version is defined and ansible_distribution_major_version|int == 7

- name: "run set_admin_password"
  shell: "! test -x /omd/sites/{{site}}/bin/set_admin_password || sudo su - {{ site }} -c 'set_admin_password omd'"

- name: "stop site"
  shell: "ps -fu {{ site }} >/dev/null || omd stop {{ site }}"

- name: "check if xinetd file exists"
  stat:
    path: /opt/omd/sites/{{ site }}/etc/naemon/xinetd.conf
  register: xinetd_livestatus
- name: "increase livestatus xinetd limit, may be hit during tests otherwise"
  lineinfile:
    dest: /opt/omd/sites/{{ site }}/etc/naemon/xinetd.conf
    line: "    cps         = 10000 3"
    regexp: '^\s*cps'
  when: xinetd_livestatus.stat.exists == true

- name: "check if naemon.cfg file exists"
  stat:
    path: /opt/omd/sites/{{ site }}/etc/naemon/naemon.cfg
  register: naemon_conf
- name: reduce naemon worker
  lineinfile:
    dest: /opt/omd/sites/{{ site }}/etc/naemon/naemon.cfg
    line: "check_workers=2"
    regexp: '^check_workers='
  when: naemon_conf.stat.exists == true

- name: increase slow_page_log_threshold
  lineinfile:
    dest: /opt/omd/sites/{{ site }}/etc/thruk/thruk_local.d/test_adjustments.conf
    line: "slow_page_log_threshold = 35"
    regexp: '^slow_page_log_threshold'
    create: true

- name: lower max fcgi processes
  lineinfile:
    dest: /opt/omd/sites/{{ site }}/etc/apache/conf.d/02_fcgid.conf
    line: "MaxProcessCount 5"
    regexp: '^MaxProcessCount'

- name: increase max requests
  lineinfile:
    dest: /opt/omd/sites/{{ site }}/etc/apache/conf.d/02_fcgid.conf
    line: "MaxRequestsPerProcess 100000"
    regexp: '^MaxRequestsPerProcess'

- name: lower max fcgi processes for thruk
  lineinfile:
    dest: /opt/omd/sites/{{ site }}/etc/apache/conf.d/thruk.conf
    insertafter: "FcgidCmdOptions"
    line: "    MaxProcesses 3 \\"
    regexp: 'MaxProcesses'

- name: make check_disk check more tolerant to avoid false positives in tests
  lineinfile:
    dest: /omd/versions/default/share/doc/naemon/example.cfg
    line: "  check_command                  check_local_disk!0.02%!0.01%!/"
    regexp: '^.*check_command.*check_local_disk!.*!.*!/'

- name: wait longer for grafana charts on busy machines
  lineinfile:
    dest: /opt/omd/sites/{{ site }}/.thruk
    line: "WAIT_TIMEOUT=120"
    regexp: '^WAIT_TIMEOUT='
    owner: "{{ site }}"
    group: "{{ site }}"
    mode: "0644"
    create: true

- name: wait longer for the browser start on busy machines
  lineinfile:
    dest: /opt/omd/sites/{{ site }}/.thruk
    line: "START_TIMEOUT=120"
    regexp: '^START_TIMEOUT='
    owner: "{{ site }}"
    group: "{{ site }}"
    mode: "0644"
    create: true

- name: "create demo script"
  copy:
    dest: /usr/local/bin/demo
    mode: '0755'
    owner: root
    group: root
    content: |
      #!/usr/bin/env bash
      echo "**************************"
      for IP in $(ip a | grep inet | grep -v inet6 | grep -v 127.0. | awk '{ print $2 }' | sed -e 's/\/.*/\/demo\//'); do
        echo "https://$IP"
      done
      echo "**************************"

      su - {{ site }}

- name: "pimp root bashrc"
  lineinfile:
    dest: /root/.bashrc
    line: "{{ bashrc_line }}"
    state: present
  loop_control:
    loop_var: bashrc_line
  with_items:
    - 'alias d="/usr/local/bin/demo"'
    - 'alias la="ls -la"'
    - 'alias l="ls -la"'
    - 'alias vi="vim"'
    - 'alias psg="ps -efl | grep"'
    - 'alias install_ansible_role="/thruk/t/scenarios/_common/ansible/install_role.sh"'
    - 'export HISTCONTROL="ignoredups:ignorespace:erasedups"'
    - 'export HISTSIZE=100000'
    - 'shopt -s histappend'
    - 'PROMPT_COMMAND="history -a"'
    - 'export HISTFILE=/var/tmp/.bash_history.$UID'
    - 'chmod 777 /var/tmp/.'

- name: "pimp {{ site }} user bashrc"
  lineinfile:
    dest: /omd/sites/{{ site }}/.bashrc
    line: "{{ bashrc_line }}"
    state: present
  loop_control:
    loop_var: bashrc_line
  with_items:
    - 'alias vi="vim"'
    - 'alias psg="ps -efl | grep"'
    - 'export HISTCONTROL="ignoredups:ignorespace:erasedups"'
    - 'export HISTSIZE=100000'
    - 'shopt -s histappend'
    - 'PROMPT_COMMAND="history -a"'
    - 'export HISTFILE=/var/tmp/.bash_history.$UID'

# an omd without THRUK_BROWSER (omd-labs nightly before the renderer change) has no browser
# the renderer looks for; install one into /var/lib/thruk/browser, a site THRUK_BROWSER wins.
# The role also runs while the base image is built, /thruk is mounted only in the scenario container.
- stat: path=/thruk/script/install_browser.sh
  register: install_browser_script

- name: "check THRUK_BROWSER of the site"
  shell: "sudo su - {{ site }} -c 'echo $THRUK_BROWSER'"
  register: site_thruk_browser
  changed_when: false

- name: "libraries of chrome-headless-shell"
  include_role:
    name: yum_apt_retry
  vars:
    rpm:
      - alsa-lib
      - atk
      - at-spi2-atk
      - at-spi2-core
      - cups-libs
      - libdrm
      - libXcomposite
      - libXdamage
      - libxkbcommon
      - libXrandr
      - mesa-libgbm
      - nss
      - pango
      - cairo
      - unzip
    deb:
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libatspi2.0-0
      - libgbm1
      - libnspr4
      - libnss3
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxkbcommon0
      - libxrandr2
      - libpango-1.0-0
      - unzip
  when:
    - install_browser_script.stat.exists
    - site_thruk_browser.stdout == ""

# start.sh exports OMD_ROOT for root, the selftest would then create $OMD_ROOT/tmp/thruk as root
# and the following 'omd start' fails to chmod it.
- name: "install a browser for rendering"
  shell: "env -u OMD_ROOT /thruk/script/install_browser.sh"
  args:
    creates: /var/lib/thruk/browser/chrome-headless-shell/chrome-headless-shell
  when:
    - install_browser_script.stat.exists
    - site_thruk_browser.stdout == ""
