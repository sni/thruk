- name: "ensure hostname has a domain"
  shell: |
    grep $(hostname) /etc/hosts | grep local >/dev/null || ( sed -e "s/$(hostname)/$(hostname) $(hostname).local/" /etc/hosts > /etc/hosts.new && cat /etc/hosts.new > /etc/hosts )
    grep '\.' /etc/hostname >/dev/null || echo $(hostname).local > /etc/hostname

- name: "install sendmail"
  include_role:
    name: yum_apt_retry
  vars:
    package:
      - sendmail
    creates:
      - /usr/sbin/sendmail

# no package provides /etc/mail/aliases, but the sendmail daemon FATALs without it
# touch creates it only if missing, so a real aliases file is never clobbered
- name: "ensure aliases file exists"
  file:
    path: /etc/mail/aliases
    state: touch
    owner: root
    group: root
    mode: "0644"

# sendmail 8.16.1-13+ moved the spool dirs out of the RPM into systemd-tmpfiles
# (RHEL-156034), which never runs in a container
- name: "run systemd tmpfiles"
  shell: systemd-tmpfiles --create
  ignore_errors: true

# fallback for distros without the tmpfiles entries
# mqueue: must match the daemon's QueueOwners (root:mail on RHEL 9), the daemon
# re-owns it on startup and queue commits fail with EPERM if owned by another user
# clientmqueue: client drop dir (373)
- name: "ensure mail queue dirs exist"
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/spool/mqueue, owner: root, group: mail, mode: "0700" }
    - { path: /var/spool/clientmqueue, owner: smmsp, group: smmsp, mode: "373" }

- name: "start sendmail"
  command: /usr/sbin/sendmail -bd -q1h

- name: "wait for local SMTP greeting"
  wait_for:
    host: 127.0.0.1
    port: 25
    search_regex: '^220[ -]'
    timeout: 30
