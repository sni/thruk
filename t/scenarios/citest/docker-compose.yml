services:
  site:
    build: citest/
    environment:
        - TZ=Europe/Berlin
    volumes:
        - ../../../:/thruk:ro
        - .:/scenario:ro
        - .:/test:ro
        - ../../../var/tmp:/var/tmp:rw
        - "../../../.ci:/.ci:ro"
        # /var/lib/naemon/thruk/* mounts come from volumes.generated.yml (merged after this file)
    ports:
        - "3000:3000"
