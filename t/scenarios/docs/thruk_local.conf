# This file is installed by the docs scenario
# (t/scenarios/docs/Makefile: `make prepare`) into the repository root as
#   thruk_local.d/docs-scenario.conf
# and loaded by thruk together with the repository root thruk_local.conf.
#
# It makes the host-side doc tests talk to the naemon backend in the
# t/scenarios/docs docker container and gives that backend a configtool
# section so the /config/* REST endpoints can build the object model.
#
# Do not edit the generated copy in the repository root, edit this template.
<Component Thruk::Backend>
    <peer>
        name    = naemon
        id      = abcd
        type    = livestatus
        <options>
            peer = 127.0.0.3:60557
        </options>
        <configtool>
            # relative to the test CWD (repo root), where var/tmp/naemon is
            # placed by extra_prepare
            core_conf = var/tmp/naemon/naemon.cfg
        </configtool>
    </peer>
</Component>

<Component Thruk::Plugin::ConfigTool>
    thruk    = ./thruk_local.conf
    cgi.cfg  = ./cgi.cfg
</Component>

<Component Thruk::Plugin::BP>
    objects_save_file      = ./var/tmp/thruk_bp_generated.cfg
    objects_templates_file = ./var/tmp/thruk_templates.cfg
</Component>

slow_page_log_threshold = 45
