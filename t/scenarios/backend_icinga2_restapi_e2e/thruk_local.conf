<Component Thruk::Backend>
    <peer>
        name    = icinga2
        id      = abcd
        type    = livestatus
        <options>
            peer   = https://127.0.0.3:60565
            verify = 0
        </options>
        <lmd_options>
            flags = ['icinga2-restv1']
            auth  = "root:test"
        </lmd_options>
    </peer>
</Component>

enable_icinga_features = 1

show_custom_vars = os

use_lmd_core=1

slow_page_log_threshold = 45
